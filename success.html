<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fancy Video Player</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="flex items-center justify-center min-h-screen bg-[#323641]">
    <div class="max-w-3xl w-full p-6 bg-gray-800 rounded-2xl shadow-lg">
        <h2 class="text-white text-2xl font-bold mb-4 text-center">I LOVE YOU ❤️❤️</h2>
        <div class="relative w-full rounded-lg overflow-hidden shadow-lg">
            <video controls class="w-full rounded-lg">
                <source src="video.mp4" type="video/mp4">
                Your browser does not support the video tag.
            </video>
        </div>
    </div>
</body>
</html>
